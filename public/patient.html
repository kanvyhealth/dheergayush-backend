<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My dashboard — DHEERGAYUSH</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/dheergayush-theme.css">
    <link rel="stylesheet" href="css/dheergayush-forms.css">
    <link rel="stylesheet" href="css/dg-patient-dashboard.css">
</head>
<body class="dg-page auth-page patient-portal dg-role-pending">
    <a href="/" id="backToHomeBtn" class="dg-home-link">Home</a>

    <div class="patient-portal-shell">
        <div class="card visible" id="loginCard">
            <h2>Sign In</h2>
            <p class="portal-login-sub">New here? <a href="telemedicine_platform.html?role=patient">Create an account</a></p>
            <form id="patientLoginForm">
                <div class="form-group">
                    <label for="patientEmail">Email</label>
                    <input type="email" id="patientEmail" name="patientEmail" required placeholder="you@email.com">
                </div>
                <div class="form-group">
                    <label for="patientPassword">Password</label>
                    <input type="password" id="patientPassword" name="patientPassword" required minlength="6" placeholder="Password">
                </div>
                <button type="submit" class="portal-btn portal-btn--primary">Sign In</button>
                <button type="button" id="patientForgotPasswordBtn" class="portal-btn portal-btn--ghost">Forgot Password?</button>
                <div id="message" class="portal-message"></div>
            </form>
        </div>

        <div id="appointmentsSection" class="dg-patient-dashboard">
            <div class="dg-pat-shell">
                <header class="dg-pat-topbar">
                    <div class="dg-pat-brand-text">
                        <p class="dg-pat-hello">Hello</p>
                        <h1 id="patientDashGreeting">Patient</h1>
                    </div>
                    <div class="dg-pat-actions">
                        <button type="button" class="dg-pat-btn dg-pat-btn--primary" id="dashNewAppointmentBtn">Book</button>
                        <button type="button" class="dg-pat-btn dg-pat-btn--ghost" id="patientLogoutBtn">Logout</button>
                    </div>
                </header>

                <div id="dashboardMessage" class="dg-portal-toast" role="alert"></div>

                <div class="dg-dash-tabs" role="tablist">
                    <button type="button" class="dg-dash-tab active" data-tab="appointments">Visits</button>
                    <button type="button" class="dg-dash-tab" data-tab="consultations">Past</button>
                    <button type="button" class="dg-dash-tab" data-tab="prescriptions">Meds</button>
                    <button type="button" class="dg-dash-tab" data-tab="orders">Orders</button>
                </div>
                <div class="dg-dash-panel active dg-dash-list" id="tab-appointments" data-panel="appointments"></div>
                <div class="dg-dash-panel dg-dash-list" id="tab-consultations" data-panel="consultations"></div>
                <div class="dg-dash-panel dg-dash-list" id="tab-prescriptions" data-panel="prescriptions"></div>
                <div class="dg-dash-panel dg-dash-list" id="tab-orders" data-panel="orders"></div>
            </div>
        </div>
    </div>

    <div id="patientAvatar" hidden>P</div>

    <script src="js/shared/dg-auth.js"></script>
    <script src="js/shared/dg-api.js"></script>
    <script src="js/doctor/dg-doctor-status.js"></script>
    <script src="js/shared/dg-site-contact.js"></script>
    <script src="patient.js"></script>
</body>
</html>
