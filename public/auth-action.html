<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Email Action | DHEERGAYUSH</title>
  <link rel="stylesheet" href="css/dheergayush-theme.css">
  <link rel="stylesheet" href="css/dg-responsive.css">
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      font-family: Poppins, Arial, sans-serif;
      background: #f5f5f5;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      padding: clamp(20px, 5vw, 32px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .1);
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px;
      color: #111;
      font-size: 1.35rem;
    }
    p {
      color: #333;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 12px;
      color: #222;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #f67227;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .msg {
      margin-top: 14px;
      font-size: .92rem;
    }
    .ok {
      color: #2e7d32;
    }
    .err {
      color: #c62828;
    }
    .links {
      margin-top: 20px;
      text-align: center;
    }
    .links a {
      color: #111;
      font-weight: 600;
    }
    #resetForm {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Processing</h1>
    <p id="subtitle">Please wait while we complete your request.</p>
    <div id="status" class="msg"></div>

    <form id="resetForm">
      <label for="newPassword">New password (min 8 characters)</label>
      <input type="password" id="newPassword" minlength="8" required autocomplete="new-password">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">
      <button type="submit">Update password</button>
    </form>

    <div class="links">
      <a href="patient.html">Patient login</a> &middot;
      <a href="doctor-auth.html">Doctor login</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var mode = params.get('mode');
      var oobCode = params.get('oobCode');
      var lang = params.get('lang') || 'en';
      var title = document.getElementById('title');
      var subtitle = document.getElementById('subtitle');
      var status = document.getElementById('status');
      var resetForm = document.getElementById('resetForm');

      function showError(msg) {
        title.textContent = 'Something went wrong';
        subtitle.textContent = msg || 'This link may be expired or already used.';
        status.textContent = '';
        status.className = 'msg err';
      }

      function showSuccess(msg) {
        status.textContent = msg;
        status.className = 'msg ok';
      }

      if (!mode || !oobCode) {
        showError('Missing verification parameters. Open the link from your email again.');
        return;
      }

      fetch('/api/firebase/config')
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          if (!cfg.apiKey) throw new Error('Firebase is not configured on this server.');
          if (!firebase.apps.length) {
            firebase.initializeApp({
              apiKey: cfg.apiKey,
              authDomain: cfg.authDomain,
              projectId: cfg.projectId,
              storageBucket: cfg.storageBucket,
              messagingSenderId: cfg.messagingSenderId,
              appId: cfg.appId || undefined
            });
          }

          var auth = firebase.auth();
          auth.languageCode = lang;

          if (mode === 'verifyEmail') {
            title.textContent = 'Verify your email';
            subtitle.textContent = 'Confirming your email address.';
            return auth.applyActionCode(oobCode).then(function () {
              title.textContent = 'Email verified';
              subtitle.textContent = 'You can sign in now on the website or mobile app.';
              showSuccess('Your email has been verified successfully.');
            });
          }

          if (mode === 'resetPassword') {
            title.textContent = 'Set a new password';
            subtitle.textContent = 'Choose a strong password for your account.';
            return auth.verifyPasswordResetCode(oobCode).then(function (email) {
              resetForm.style.display = 'block';
              subtitle.textContent = 'Reset password for ' + email;
              resetForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var p1 = document.getElementById('newPassword').value;
                var p2 = document.getElementById('confirmPassword').value;
                if (p1.length < 8) {
                  showError('Password must be at least 8 characters.');
                  return;
                }
                if (p1 !== p2) {
                  showError('Passwords do not match.');
                  return;
                }
                status.textContent = 'Updating...';
                status.className = 'msg';
                auth.confirmPasswordReset(oobCode, p1)
                  .then(function () {
                    resetForm.style.display = 'none';
                    title.textContent = 'Password updated';
                    subtitle.textContent = 'You can sign in with your new password on the website or mobile app.';
                    showSuccess('Password reset complete.');
                  })
                  .catch(function (err) {
                    showError(err.message || 'Could not reset password.');
                  });
              });
            });
          }

          showError('Unsupported action: ' + mode);
        })
        .catch(function (err) {
          showError(err.message || 'Could not complete this action.');
        });
    })();
  </script>
</body>
</html>
