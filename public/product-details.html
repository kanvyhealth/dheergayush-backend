<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product details — DHEERGAYUSH</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/dheergayush-theme.css">
  <link rel="stylesheet" href="css/dheergayush-forms.css">
  <link rel="stylesheet" href="css/dg-responsive.css">
  <link rel="stylesheet" href="css/dg-store-responsive.css">
  <style>
    .pd-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 5% 48px;
    }
    .pd-crumb {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 16px;
    }
    .pd-crumb a { color: var(--dg-orange); text-decoration: none; font-weight: 600; }
    .pd-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 28px;
      align-items: start;
    }
    .pd-media {
      background: #fff;
      border: 1px solid rgba(60,60,60,0.08);
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pd-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fafafa;
    }
    .pd-brand {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--dg-orange);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pd-title {
      font-family: var(--dg-display);
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin: 0 0 10px;
      color: var(--dg-charcoal);
    }
    .pd-desc {
      color: #555;
      line-height: 1.55;
      margin: 0 0 16px;
    }
    .pd-meta { font-size: 0.9rem; color: #666; margin-bottom: 14px; }
    .pd-price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--dg-charcoal);
      margin: 0 0 14px;
    }
    .pd-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }
    .pd-recs h2 {
      font-family: var(--dg-display);
      font-size: 1.35rem;
      margin: 36px 0 14px;
      color: var(--dg-charcoal);
    }
    .pd-recs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .pd-rec-card {
      background: #fff;
      border: 1px solid rgba(60,60,60,0.08);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .pd-rec-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--dg-shadow);
    }
    .pd-rec-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fafafa;
    }
    .pd-rec-card .body { padding: 10px 12px 14px; }
    .pd-rec-card h3 {
      margin: 0 0 4px;
      font-size: 0.92rem;
      line-height: 1.3;
    }
    .pd-rec-card .price {
      font-weight: 700;
      color: var(--dg-orange);
      font-size: 0.95rem;
    }
    .pd-error {
      padding: 24px;
      background: #fff5f5;
      border-radius: 12px;
      color: #b00020;
    }
    @media (max-width: 768px) {
      .pd-main { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body>
  <div class="delivery-banner"><i class="fas fa-truck"></i> Free delivery on eligible Ayurvedic store orders</div>
  <div class="pd-wrap">
    <nav class="pd-crumb" aria-label="Breadcrumb">
      <a href="/stores.html">Store</a> <span>›</span> <span id="pdCrumbName">Product</span>
    </nav>
    <div id="pdRoot">
      <p>Loading product…</p>
    </div>
    <section class="pd-recs" id="pdRecsSection" hidden>
      <h2>You may also like</h2>
      <div class="pd-recs-grid" id="pdRecs"></div>
    </section>
  </div>
  <div class="success-toast cart-added-toast" id="cartAddedToast" role="status" aria-live="polite" hidden></div>
  <script src="js/store/medicine-images.js"></script>
  <script src="js/store/dg-product-details.js"></script>
  <script src="js/shared/dg-responsive-nav.js"></script>
</body>
</html>
