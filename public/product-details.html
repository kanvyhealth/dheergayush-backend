<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product details — DHEERGAYUSH</title>
  <meta name="description" content="Authentic Ayurvedic medicines, organic foods and wellness products from physician-trusted brands, delivered by DHEERGAYUSH.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/dheergayush-theme.css">
  <link rel="stylesheet" href="/css/dheergayush-forms.css">
  <link rel="stylesheet" href="/css/dg-responsive.css">
  <link rel="stylesheet" href="/css/dg-store-responsive.css">
  <style>
    /* position: sticky resolves against the viewport, but the global
       body { overflow-y: auto } makes body a scrollport with no travel. */
    body.dg-page { overflow: visible; }

    /* Banner and toast base styles live in the store page, so repeat them here. */
    .delivery-banner {
      background: linear-gradient(90deg, var(--dg-charcoal), #555);
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .delivery-banner i { color: var(--dg-orange-light); margin-right: 8px; }

    .success-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dg-charcoal);
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.35s;
      z-index: 2000;
    }
    .success-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .success-toast.cart-added-toast {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      box-shadow: 0 8px 24px rgba(46, 125, 50, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(92vw, 420px);
      text-align: left;
    }

    .cart-btn-nav {
      position: relative;
      background: linear-gradient(135deg, var(--dg-orange), var(--dg-orange-light));
      color: var(--dg-charcoal) !important;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(242, 103, 39, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    #cartBadge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--dg-charcoal);
      color: #fff;
      font-size: 11px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .pd-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .pd-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px clamp(12px, 5vw, 40px) 56px;
    }

    .pd-crumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #6b6b6b;
      margin-bottom: 16px;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .pd-crumb::-webkit-scrollbar { display: none; }
    .pd-crumb a { color: var(--dg-orange); text-decoration: none; font-weight: 600; }
    .pd-crumb a:hover { text-decoration: underline; }
    .pd-crumb .sep { color: #c4c4c4; }
    .pd-crumb strong { color: var(--dg-charcoal); font-weight: 600; }

    .pd-shell {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      gap: clamp(18px, 3vw, 36px);
      align-items: start;
    }

    /* ── Gallery ── */
    .pd-gallery { position: sticky; top: 96px; }
    .pd-stage {
      position: relative;
      background:
        radial-gradient(circle at 50% 35%, #fff 0%, #fffaf6 55%, #fdf3ec 100%);
      border: 1px solid var(--dg-border);
      border-radius: 20px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(60, 60, 60, 0.06);
    }
    .pd-stage img {
      width: auto;
      height: auto;
      max-width: 88%;
      max-height: 88%;
      object-fit: contain;
      transition: transform 0.4s ease;
    }
    .pd-stage:hover img { transform: scale(1.07); }
    .pd-stage-fallback {
      display: grid;
      place-items: center;
      gap: 8px;
      color: #c9a58c;
      font-size: 0.85rem;
    }
    .pd-stage-fallback i { font-size: 3rem; color: #e3c7b4; }
    .pd-stage-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--dg-border);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dg-orange);
      backdrop-filter: blur(4px);
    }

    .pd-assure {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .pd-assure div {
      background: #fff;
      border: 1px solid var(--dg-border);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #555;
      line-height: 1.35;
    }
    .pd-assure i {
      display: block;
      font-size: 1.05rem;
      color: var(--dg-orange);
      margin-bottom: 6px;
    }

    /* ── Buy box ── */
    .pd-buybox {
      background: #fff;
      border: 1px solid var(--dg-border);
      border-radius: 20px;
      padding: clamp(16px, 2.4vw, 28px);
      box-shadow: var(--dg-shadow);
    }
    .pd-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(242, 103, 39, 0.1);
      color: var(--dg-orange);
      border-radius: 50px;
      padding: 5px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pd-title {
      font-family: var(--dg-display);
      font-size: clamp(1.35rem, 2.6vw, 2.05rem);
      line-height: 1.25;
      margin: 12px 0 10px;
      color: var(--dg-charcoal);
    }
    .pd-rating {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: #666;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--dg-border);
    }
    .pd-rating .stars { color: #f5a623; letter-spacing: 1px; }
    .pd-rating .score { font-weight: 700; color: var(--dg-charcoal); }
    .pd-rating .in-stock { color: #2e7d32; font-weight: 600; }
    .pd-rating .dot { color: #ccc; }

    .pd-price-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 4px;
    }
    .pd-price {
      font-size: clamp(1.6rem, 3vw, 2.05rem);
      font-weight: 800;
      color: var(--dg-charcoal);
      line-height: 1;
    }
    .pd-price-unit { font-size: 0.9rem; color: #777; font-weight: 500; }
    .pd-tax-note { font-size: 0.75rem; color: #8a8a8a; margin: 0 0 18px; }

    .pd-field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #7a7a7a;
      margin: 0 0 8px;
    }

    .pd-packs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .pd-pack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-height: 46px;
      padding: 7px 14px;
      background: #fff;
      border: 1.5px solid var(--dg-border);
      border-radius: 12px;
      font-family: var(--dg-font);
      font-weight: 600;
      font-size: 0.86rem;
      color: var(--dg-charcoal);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }
    .pd-pack span { font-size: 0.76rem; font-weight: 500; color: #777; }
    .pd-pack:hover { border-color: var(--dg-orange-light); }
    .pd-pack[aria-pressed="true"] {
      border-color: var(--dg-orange);
      background: rgba(242, 103, 39, 0.07);
      box-shadow: 0 0 0 3px rgba(242, 103, 39, 0.12);
    }
    .pd-pack[aria-pressed="true"] span { color: var(--dg-orange); }

    .pd-buy-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .pd-qty {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1.5px solid var(--dg-border);
      border-radius: 12px;
      padding: 4px;
      background: #fff;
    }
    .pd-qty button {
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(242, 103, 39, 0.1);
      color: var(--dg-orange);
      border-radius: 9px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }
    .pd-qty button:hover { background: rgba(242, 103, 39, 0.2); }
    .pd-qty button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pd-qty .val {
      min-width: 34px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .pd-buy-row .dg-btn-primary,
    .pd-buy-row .dg-btn-outline {
      flex: 1 1 190px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pd-trust {
      list-style: none;
      margin: 0;
      padding: 16px 0 0;
      border-top: 1px solid var(--dg-border);
      display: grid;
      gap: 12px;
    }
    .pd-trust li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.86rem;
      color: #555;
      line-height: 1.4;
    }
    .pd-trust i {
      flex: 0 0 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: rgba(242, 103, 39, 0.1);
      color: var(--dg-orange);
      border-radius: 50%;
      font-size: 0.85rem;
    }

    /* ── Detail cards ── */
    .pd-panel {
      background: #fff;
      border: 1px solid var(--dg-border);
      border-radius: 18px;
      padding: clamp(16px, 2.2vw, 26px);
      margin-top: clamp(18px, 3vw, 32px);
    }
    .pd-panel h2 {
      font-family: var(--dg-display);
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      margin: 0 0 12px;
      color: var(--dg-charcoal);
    }
    .pd-panel p { color: #555; line-height: 1.65; margin: 0 0 10px; }

    .pd-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0 28px;
    }
    .pd-spec {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px dashed var(--dg-border);
      font-size: 0.88rem;
    }
    .pd-spec dt { color: #7a7a7a; margin: 0; }
    .pd-spec dd { margin: 0; font-weight: 600; text-align: right; color: var(--dg-charcoal); }

    /* ── Recommendations ── */
    .pd-recs { margin-top: clamp(24px, 4vw, 44px); }
    .pd-recs h2 {
      font-family: var(--dg-display);
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      margin: 0 0 14px;
      color: var(--dg-charcoal);
    }
    .pd-recs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }
    .pd-rec-card {
      background: #fff;
      border: 1px solid var(--dg-border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .pd-rec-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(242, 103, 39, 0.14);
    }
    .pd-rec-thumb {
      aspect-ratio: 1;
      background: #fafafa;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .pd-rec-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .pd-rec-thumb i { font-size: 1.8rem; color: #e0cfc4; }
    .pd-rec-card .body { padding: 10px 12px 14px; display: grid; gap: 4px; }
    .pd-rec-card .brand {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--dg-orange);
    }
    .pd-rec-card h3 {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.3;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pd-rec-card .price { font-weight: 700; font-size: 0.95rem; }

    /* ── Loading / error ── */
    .pd-skel-shell {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      gap: clamp(18px, 3vw, 36px);
    }
    .pd-skel {
      background: linear-gradient(90deg, #f2f2f2 25%, #e9e9e9 37%, #f2f2f2 63%);
      background-size: 400% 100%;
      animation: pd-shimmer 1.3s ease-in-out infinite;
      border-radius: 10px;
    }
    .pd-skel.stage { aspect-ratio: 1; border-radius: 20px; }
    .pd-skel.line { height: 16px; margin-bottom: 12px; }
    .pd-skel.line.short { width: 40%; }
    .pd-skel.line.title { height: 30px; width: 75%; }
    .pd-skel.block { height: 130px; margin-top: 20px; }
    @keyframes pd-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }
    .pd-error {
      padding: 28px;
      background: #fff;
      border: 1px solid rgba(176, 0, 32, 0.2);
      border-radius: 16px;
      color: #b00020;
      text-align: center;
    }
    .pd-error i { font-size: 1.6rem; display: block; margin-bottom: 10px; }
    .pd-error a { color: var(--dg-orange); font-weight: 600; }

    /* ── Sticky mobile buy bar ── */
    .pd-sticky {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 900;
      display: none;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-top: 1px solid var(--dg-border);
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
      padding: 10px clamp(12px, 4vw, 20px) calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .pd-sticky .info { display: grid; gap: 2px; min-width: 0; }
    .pd-sticky .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8a8a8a;
      font-weight: 600;
    }
    .pd-sticky .price { font-size: 1.15rem; font-weight: 800; line-height: 1; }
    .pd-sticky .dg-btn-primary {
      flex: 1;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .pd-shell,
      .pd-skel-shell { grid-template-columns: 1fr; }
      .pd-gallery { position: static; }
      .pd-stage { max-width: 460px; margin: 0 auto; width: 100%; }
      .pd-assure { max-width: 460px; margin-left: auto; margin-right: auto; }
      .pd-wrap { padding-bottom: 96px; }
      body.pd-has-product .pd-sticky { display: flex; }
    }

    @media (max-width: 600px) {
      .pd-buybox,
      .pd-panel { border-radius: 16px; }
      .pd-assure div { font-size: 0.66rem; padding: 10px 6px; }
      .pd-buy-row .dg-btn-primary,
      .pd-buy-row .dg-btn-outline { flex: 1 1 100%; }
      .pd-qty { width: 100%; justify-content: space-between; }
      .pd-recs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .pd-spec { font-size: 0.84rem; }
    }

    @media (max-width: 380px) {
      .pd-pack { flex: 1 1 100%; }
      .pd-sticky .price { font-size: 1.05rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pd-skel { animation: none; }
      .pd-stage img,
      .pd-rec-card { transition: none; }
      .pd-stage:hover img { transform: none; }
      .pd-rec-card:hover { transform: none; }
    }
  </style>
</head>
<body class="dg-page">
  <div class="delivery-banner">
    <i class="fas fa-truck"></i> Free delivery on eligible Ayurvedic store orders
  </div>

  <nav class="dg-navbar">
    <div class="dg-nav-inner">
      <a href="/" class="logo"><img src="/logos/logo-horizontal.png" alt="DHEERGAYUSH"></a>
      <ul class="dg-nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/CMEs.html">CMEs</a></li>
        <li><a href="/Library.html">E-Library</a></li>
        <li><a href="/landingpage.html" class="dg-btn-primary" style="padding:10px 18px;font-size:0.85rem;">Book Consultation</a></li>
        <li><a href="/store" class="active">Store</a></li>
      </ul>
      <a href="/store" class="cart-btn-nav" id="cartBtn" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartBadge">0</span>
      </a>
    </div>
  </nav>

  <div class="pd-wrap">
    <nav class="pd-crumb" id="pdCrumb" aria-label="Breadcrumb">
      <a href="/">Home</a> <span class="sep">›</span> <a href="/store">Store</a>
      <span class="sep">›</span> <strong id="pdCrumbName">Product</strong>
    </nav>

    <div id="pdRoot">
      <div class="pd-skel-shell" aria-hidden="true">
        <div class="pd-skel stage"></div>
        <div>
          <div class="pd-skel line short"></div>
          <div class="pd-skel line title"></div>
          <div class="pd-skel line"></div>
          <div class="pd-skel line short"></div>
          <div class="pd-skel block"></div>
        </div>
      </div>
      <p class="pd-sr-only" role="status">Loading product…</p>
    </div>

    <section class="pd-recs" id="pdRecsSection" hidden>
      <h2>You may also like</h2>
      <div class="pd-recs-grid" id="pdRecs"></div>
    </section>
  </div>

  <div class="pd-sticky" id="pdSticky" hidden>
    <div class="info">
      <span class="label">Total</span>
      <span class="price" id="pdStickyPrice">—</span>
    </div>
    <button type="button" class="dg-btn-primary" id="pdStickyAdd">
      <i class="fas fa-cart-plus"></i> Add to cart
    </button>
  </div>

  <div class="success-toast cart-added-toast" id="cartAddedToast" role="status" aria-live="polite" hidden></div>

  <script src="/js/store/medicine-images.js"></script>
  <script src="/js/store/dg-store-categories.js"></script>
  <script src="/js/store/dg-product-details.js"></script>
  <script src="/js/shared/dg-responsive-nav.js"></script>
</body>
</html>
